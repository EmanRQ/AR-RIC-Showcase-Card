<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Showcase Experience</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR A-Frame Integration Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- ✅ TAMBAH INI: A-Frame Extras (diperlukan untuk animation-mixer) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- AR Scene Container -->
    <a-scene 
      mindar-image="imageTargetSrc: target.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Load your 3D animated GLB model -->
        <a-asset-item id="showcaseModel" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- Camera configuration for AR tracking -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Anchor (index: 0 maps to your first compiled target.mind image) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 3D Model: Adjust position, scale, and rotation to fit your physical card layout -->
        <a-gltf-model 
          src="#showcaseModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0" 
          animation-mixer>
        </a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
