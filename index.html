<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Showcase Experience</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR A-Frame Integration Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- A-Frame Extras (Untuk Animasi GLB) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <script>
      // Register custom click-url component khas untuk A-Frame pada telefon pintar
      AFRAME.registerComponent('click-url', {
        schema: { type: 'string' },
        init: function () {
          const url = this.data;
          this.el.addEventListener('click', () => {
            if (url) {
              window.open(url, '_blank');
            }
          });
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Custom Splash Screen Overlay */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, #000000 0%, #6e00fd 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
        color: #ffffff;
      }

      #splash-screen img {
        width: 300px !important; 
        max-width: 100vw !important;
        height: auto !important;
        object-fit: contain;
        margin-bottom: 25px;
        pointer-events: none;
        animation: pulse 2s infinite ease-in-out;
      }

      #splash-screen .loading-text {
        font-size: 16px;
        color: #cbd5e1;
        letter-spacing: 1.5px;
        font-weight: bold;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
        100% { transform: scale(1); opacity: 0.95; }
      }

      .mindar-ui-loading {
        display: none !important;
      }

      .raycastable {
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Custom Splash Screen UI -->
    <div id="splash-screen">
      <img src="ric-logo.gif" alt="RIC Logo" />
      <div class="loading-text">Preparing AR Experience...</div>
    </div>

    <!-- AR Scene Container -->
    <a-scene 
      mindar-image="imageTargetSrc: target.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false"
      raycaster="objects: .raycastable">
      
      <a-assets>
        <!-- Model Karakter 3D -->
        <a-asset-item id="showcaseModel" src="model.glb"></a-asset-item>
        
        <!-- Sumber fail PNG static title -->
        <img id="titlePng" src="RIC-Title.png" crossorigin="anonymous">

        <!-- Sumber fail PNG social media -->
        <img id="socialPng" src="ric-social.png" crossorigin="anonymous">
      </a-assets>

      <!-- Kamera dengan Raycaster & Mouse Cursor untuk Skrin Sentuh -->
      <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .raycastable" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">

        <!-- 1. Karakter 3D -->
        <a-gltf-model 
          id="ar-model"
          src="#showcaseModel" 
          position="-0.9 -0.7 0" 
          scale="1 1 1" 
          rotation="0 0 0" 
          animation-mixer="clip: *; loop: repeat; timeScale: 1;">
        </a-gltf-model>

        <!-- 2. Title PNG -->
        <a-image 
          src="#titlePng" 
          position="0 0.5 0.02" 
          width="2.8" 
          height="2.3">
        </a-image>

        <!-- 3. Social PNG -->
        <a-image
          src="#socialPng" 
          position="0.1 0 0.02" 
          width="3.2" 
          height="2.8">
        </a-image>

        <!-- 4. BUTANG DENGAN KOMPONEN `click-url` (Nilai Z = 0.1 di hadapan sekali) -->
        
        <!-- Butang Facebook (Merah Telus) -->
        <a-plane 
          id="btn-facebook" 
          class="raycastable"
          click-url="https://web.facebook.com/profile.php?id=100081127783381"
          position="0.1 0.7 0.1" 
          width="1.0" 
          height="0.5" 
          material="color: red; opacity: 0.5; transparent: true;">
        </a-plane>

        <!-- Butang Instagram (Hijau Telus) -->
        <a-plane 
          id="btn-instagram" 
          class="raycastable"
          click-url="https://www.instagram.com/rauboticsclub?utm_source=qr&obrf=Z3dma2g1dXgwMXdt"
          position="0.1 0 0.1" 
          width="1.0" 
          height="0.5" 
          material="color: green; opacity: 0.5; transparent: true;">
        </a-plane>

        <!-- Butang TikTok (Biru Telus) -->
        <a-plane 
          id="btn-tiktok" 
          class="raycastable"
          click-url="https://www.tiktok.com/@ricraub?_r=1&_t=ZS-9AeweMHrQav"
          position="0.1 -0.7 0.1" 
          width="1.0" 
          height="0.5" 
          material="color: blue; opacity: 0.5; transparent: true;">
        </a-plane>

      </a-entity>
      
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("a-scene");
        const splashEl = document.getElementById("splash-screen");
        const targetEntity = document.getElementById("target-entity");
        const modelEl = document.getElementById("ar-model");

        sceneEl.addEventListener("arReady", () => {
          setTimeout(() => {
            splashEl.style.opacity = "0";
            splashEl.style.visibility = "hidden";
          }, 600);
        });

        targetEntity.addEventListener("targetFound", () => {
          modelEl.setAttribute("animation-mixer", "clip: *; timeScale: 1; loop: repeat;");
        });
      });
    </script>
  </body>
</html>
