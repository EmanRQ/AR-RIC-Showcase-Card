<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Showcase Experience</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR A-Frame Integration Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- A-Frame Extras (Untuk Animasi GLB) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Custom Splash Screen Overlay */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, #050515 0%, #111452 50%, #33533cd 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
        color: #ffffff;
      }

      /* Logo Lebih Besar */
      #splash-screen img {
        width: 280px; /* Dibesarkan dari 220px */
        max-width: 80vw;
        height: auto;
        margin-bottom: 30px;
        animation: pulse 2s infinite ease-in-out;
      }

      #splash-screen .loading-text {
        font-size: 16px;
        color: #cbd5e1;
        letter-spacing: 1.5px;
        font-weight: 500;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
        100% { transform: scale(1); opacity: 0.95; }
      }

      .mindar-ui-loading {
        display: none !important;
      }
    </style>
  </head>
  <body>

    <!-- Custom Splash Screen UI -->
    <div id="splash-screen">
      <img src="ric-logo.svg" alt="RIC Logo" />
      <div class="loading-text">Preparing AR Experience...</div>
    </div>

    <!-- AR Scene Container -->
    <a-scene 
      mindar-image="imageTargetSrc: target.mind; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="showcaseModel" src="model.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <!-- Modul Animasi Ditetapkan Khas Untuk Loop Selamanya -->
        <a-gltf-model 
          id="ar-model"
          src="#showcaseModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0" 
          animation-mixer="loop: repeat; timeScale: 1;">
        </a-gltf-model>
      </a-entity>
      
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("a-scene");
        const splashEl = document.getElementById("splash-screen");
        const targetEntity = document.getElementById("target-entity");
        const modelEl = document.getElementById("ar-model");

        // Tutup Splash Screen bila AR bersedia
        sceneEl.addEventListener("arReady", () => {
          setTimeout(() => {
            splashEl.style.opacity = "0";
            splashEl.style.visibility = "hidden";
          }, 600);
        });

        // Memastikan animasi main/loop bila kad dikesan
        targetEntity.addEventListener("targetFound", () => {
          modelEl.setAttribute("animation-mixer", "timeScale: 1; loop: repeat;");
        });
      });
    </script>
  </body>
</html>
