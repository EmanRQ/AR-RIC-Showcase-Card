<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Showcase Experience</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR A-Frame Integration Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- A-Frame Extras (Untuk Animasi) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Custom Splash Screen Overlay */
      #splash-screen {
  	position: fixed;
  	top: 0;
  	left: 0;
  	width: 100vw;
  	height: 100vh;
  	/* Gradient gelap di atas ke biru di bawah */
  	background: linear-gradient(180deg, #050515 0%, #111452 45%, #282da8 100%);
  	display: flex;
  	flex-direction: column;
  	justify-content: center;
  	align-items: center;
  	z-index: 99999;
  	transition: opacity 0.8s ease, visibility 0.8s ease;
  	color: #ffffff;
      }

      #splash-screen img {
        width: 140px; /* Laraskan saiz logo di sini */
        height: auto;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      #splash-screen h2 {
        margin: 0 0 10px 0;
        font-size: 20px;
        letter-spacing: 1px;
      }

      #splash-screen p {
        margin: 0;
        font-size: 14px;
        color: #94a3b8;
      }

      /* Animasi Pulse Ringkas pada Logo */
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      /* Sembunyikan UI Loading Default MindAR */
      .mindar-ui-loading {
        display: none !important;
      }
    </style>
  </head>
  <body>

    <!-- Custom Splash Screen UI -->
    <div id="splash-screen">
      <!-- Gantikan ric-logo.png dengan nama fail logo RIC anda -->
      <img src="ric-logo.svg" alt="RIC Logo" />
      <div class="loading-text">Preparing AR Experience...</div>
    </div>

    <!-- AR Scene Container -->
    <a-scene 
      mindar-image="imageTargetSrc: target.mind; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="showcaseModel" src="model.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="#showcaseModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0" 
          animation-mixer>
        </a-gltf-model>
      </a-entity>
      
    </a-scene>

    <script>
      // Sembunyikan splash screen apabila sistem MindAR sedia
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("a-scene");
        const splashEl = document.getElementById("splash-screen");

        sceneEl.addEventListener("arReady", () => {
          setTimeout(() => {
            splashEl.style.opacity = "0";
            splashEl.style.visibility = "hidden";
          }, 500); // Penangguhan kecil untuk peralihan halus
        });
      });
    </script>
  </body>
</html>
