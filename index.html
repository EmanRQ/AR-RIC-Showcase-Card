<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Showcase Experience</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR A-Frame Integration Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- A-Frame Extras (Untuk Animasi GLB) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Custom Splash Screen Overlay */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, #000000 0%, #6e00fd 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
        color: #ffffff;
      }

      #splash-screen img {
        width: 300px !important; 
        max-width: 100vw !important;
        height: auto !important;
        object-fit: contain;
        margin-bottom: 25px;
        pointer-events: none;
        animation: pulse 2s infinite ease-in-out;
      }

      #splash-screen .loading-text {
        font-size: 16px;
        color: #cbd5e1;
        letter-spacing: 1.5px;
        font-weight: bold;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
        100% { transform: scale(1); opacity: 0.95; }
      }

      .mindar-ui-loading {
        display: none !important;
      }

      /* --- HTML OVERLAY BUTTONS (Terapung di atas skrin AR & 100% boleh diklik) --- */
      #social-buttons-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: none; /* Sembunyi selagi target belum jumpa */
        pointer-events: none; /* Biar sentuhan tembus ke kamera, kecuali pada butang */
        z-index: 9999;
      }

      .ar-social-btn {
        position: absolute;
        pointer-events: auto; /* Membolehkan butang diklik */
        border: none !important;
        background: transparent !important; /* Letak warna latar sementara untuk nampak petak */
        border-radius: 10px;
        cursor: pointer;
      }

      /* Sesuaikan kedudukan (top, left, width, height) petak butang ini mengikut skrin telefon anda */
      #btn-fb { top: 20%; left: 50%; width: 200px; height: 140px; background: transparent; border: none; }
      #btn-ig { top: 40%; left: 50%; width: 200px; height: 140px; background: transparent; border: none; }
      #btn-tk { top: 60%; left: 50%; width: 200px; height: 140px; background: transparent; border: none; }
    </style>
  </head>
  <body>

    <!-- Custom Splash Screen UI -->
    <div id="splash-screen">
      <img src="ric-logo.gif" alt="RIC Logo" />
      <div class="loading-text">Preparing AR Experience...</div>
    </div>

    <!-- HTML Button Overlay yang akan muncul bila target dikesan -->
    <div id="social-buttons-container">
      <div id="btn-fb" class="ar-social-btn"></div>
      <div id="btn-ig" class="ar-social-btn"></div>
      <div id="btn-tk" class="ar-social-btn"></div>
    </div>

    <!-- AR Scene Container (Hanya fokus pada Model & Imej Visual AR) -->
    <a-scene 
      mindar-image="imageTargetSrc: target.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false">
      
      <a-assets>
        <!-- Model Karakter 3D -->
        <a-asset-item id="showcaseModel" src="model.glb"></a-asset-item>
        
        <!-- Sumber fail PNG static title -->
        <img id="titlePng" src="RIC-Title.png" crossorigin="anonymous">

        <!-- Sumber fail PNG social media -->
        <img id="socialPng" src="ric-social.png" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">

        <!-- 1. Karakter 3D -->
        <a-gltf-model 
          id="ar-model"
          src="#showcaseModel" 
          position="-0.9 -0.7 0" 
          scale="1 1 1" 
          rotation="0 0 0" 
          animation-mixer="clip: *; loop: repeat; timeScale: 1;">
        </a-gltf-model>

        <!-- 2. Title PNG -->
        <a-image 
          src="#titlePng" 
          position="0 0.5 0.02" 
          width="2.8" 
          height="2.3">
        </a-image>

        <!-- 3. Social PNG (Visual Ikon Media Sosial) -->
        <a-image
          src="#socialPng" 
          position="0.1 0 0.03" 
          width="3.2" 
          height="2.8">
        </a-image>

      </a-entity>
      
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("a-scene");
        const splashEl = document.getElementById("splash-screen");
        const targetEntity = document.getElementById("target-entity");
        const modelEl = document.getElementById("ar-model");
        const socialContainer = document.getElementById("social-buttons-container");

        sceneEl.addEventListener("arReady", () => {
          setTimeout(() => {
            splashEl.style.opacity = "0";
            splashEl.style.visibility = "hidden";
          }, 600);
        });

        // Apabila kad dikesan, paparkan model 3D DAN butang HTML di atas skrin
        targetEntity.addEventListener("targetFound", () => {
          modelEl.setAttribute("animation-mixer", "clip: *; timeScale: 1; loop: repeat;");
          socialContainer.style.display = "block";
        });

        // Apabila kad hilang dari pandangan kamera, sembunyikan semula butang
        targetEntity.addEventListener("targetLost", () => {
          socialContainer.style.display = "none";
        });

        // --- SKRIP KLIK HTML OVERLAY (Dijamin 100% Berfungsi & Responsif) ---
        document.getElementById("btn-fb").addEventListener("click", () => {
          window.open("https://web.facebook.com/profile.php?id=100081127783381", "_blank");
        });

        document.getElementById("btn-ig").addEventListener("click", () => {
          window.open("https://www.instagram.com/rauboticsclub?utm_source=qr&obrf=Z3dma2g1dXgwMXdt", "_blank");
        });

        document.getElementById("btn-tk").addEventListener("click", () => {
          window.open("https://www.tiktok.com/@ricraub?_r=1&_t=ZS-9AeweMHrQav", "_blank");
        });
      });
    </script>
  </body>
</html>
